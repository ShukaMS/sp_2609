<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>たべきり冷蔵庫</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- ヘッダー -->
    <header class="top">
      <p class="today" id="today"></p>
      <h1 id="pageTitle">たべきり冷蔵庫</h1>
    </header>

    <main>
      <!-- ========== 冷蔵庫タブ ========== -->
      <section class="view" id="view-fridge">
        <div class="sample-note" id="sampleNote" hidden>
          <span>サンプルの食材を表示しています</span>
          <button type="button" class="link-btn" id="clearSample">消して始める</button>
        </div>

        <!-- 期限のまとめ -->
        <div class="summary">
          <button type="button" class="stat stat-expired" data-filter="urgent">
            <span class="stat-num" id="countExpired">0</span>
            <span class="stat-label">期限切れ</span>
          </button>
          <button type="button" class="stat stat-soon" data-filter="urgent">
            <span class="stat-num" id="countSoon">0</span>
            <span class="stat-label">3日以内</span>
          </button>
          <button type="button" class="stat stat-all" data-filter="all">
            <span class="stat-num" id="countAll">0</span>
            <span class="stat-label">ぜんぶ</span>
          </button>
        </div>

        <!-- 絞り込み -->
        <div class="chips" id="filters" role="tablist" aria-label="保存場所で絞り込み"></div>

        <ul class="food-list" id="foodList"></ul>
        <div class="empty" id="foodEmpty" hidden>
          <p class="empty-icon">🧊</p>
          <p id="foodEmptyText">下の「食材を追加」から登録しましょう</p>
        </div>
      </section>

      <!-- ========== 買い物タブ ========== -->
      <section class="view" id="view-shopping" hidden>
        <form class="shop-form" id="shopForm">
          <label class="sr-only" for="shopInput">買うもの</label>
          <input type="text" id="shopInput" placeholder="買うものを入力" autocomplete="off">
          <button type="submit" class="btn btn-primary">追加</button>
        </form>
        <ul class="shop-list" id="shopList"></ul>
        <div class="empty" id="shopEmpty" hidden>
          <p class="empty-icon">🛒</p>
          <p>食材を使い切ったら、ここに追加できます</p>
        </div>
        <button type="button" class="link-btn center" id="clearDone" hidden>チェック済みを消す</button>
      </section>

      <!-- ========== 記録タブ ========== -->
      <section class="view" id="view-stats" hidden>
        <div class="panel">
          <p class="panel-title" id="rateTitle">今月の使い切り率</p>
          <p class="big-rate"><span id="rate">--</span><small>%</small></p>
          <div class="ratio-bar" id="ratioBar" aria-hidden="true">
            <span class="ratio-used" id="ratioUsed"></span>
            <span class="ratio-wasted" id="ratioWasted"></span>
          </div>
          <div class="legend">
            <span class="legend-used">使い切った <b id="usedCount">0</b>件</span>
            <span class="legend-wasted">捨てた <b id="wastedCount">0</b>件</span>
          </div>
          <p class="rate-message" id="rateMessage"></p>
        </div>

        <div class="panel" id="rankPanel" hidden>
          <p class="panel-title">よく捨ててしまう食材</p>
          <ol class="rank" id="rankList"></ol>
          <p class="hint">次に買うときは、量を減らすのがおすすめです</p>
        </div>

        <div class="panel">
          <p class="panel-title">最近の記録</p>
          <ul class="log-list" id="logList"></ul>
        </div>

        <div class="panel">
          <p class="panel-title">データ</p>
          <button type="button" class="row-btn" id="loadSample">サンプルデータを入れる</button>
          <button type="button" class="row-btn danger" id="resetAll">すべてのデータを削除</button>
        </div>
      </section>
    </main>
  </div>

  <!-- 追加ボタン -->
  <button type="button" class="fab" id="addBtn">＋ 食材を追加</button>

  <!-- 下のタブ -->
  <nav class="tabbar" aria-label="画面切り替え">
    <button type="button" class="tab is-active" data-tab="fridge">
      <span class="tab-icon">🧊<i class="tab-badge" id="badgeFridge" hidden></i></span>冷蔵庫
    </button>
    <button type="button" class="tab" data-tab="shopping">
      <span class="tab-icon">🛒<i class="tab-badge" id="badgeShop" hidden></i></span>買い物
    </button>
    <button type="button" class="tab" data-tab="stats">
      <span class="tab-icon">📊</span>記録
    </button>
  </nav>

  <!-- ========== 食材の登録シート ========== -->
  <div class="backdrop" id="sheet" hidden>
    <form class="sheet" id="foodForm" novalidate>
      <div class="sheet-head">
        <button type="button" class="link-btn" id="sheetCancel">キャンセル</button>
        <h2 id="sheetTitle">食材を追加</h2>
        <button type="submit" class="link-btn strong">保存</button>
      </div>

      <div class="sheet-body">
        <label class="photo" for="photoInput">
          <img id="photoPreview" alt="" hidden>
          <span class="photo-empty" id="photoEmpty">📷<small>写真を撮る・選ぶ</small></span>
        </label>
        <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
        <button type="button" class="link-btn center" id="photoRemove" hidden>写真を外す</button>

        <label class="field-label" for="nameInput">食材の名前</label>
        <input type="text" id="nameInput" placeholder="例:牛乳" autocomplete="off">

        <p class="field-label">保存場所</p>
        <div class="chips wrap" id="locationChips"></div>

        <p class="field-label">数量</p>
        <div class="stepper">
          <button type="button" class="step" id="qtyMinus" aria-label="1つ減らす">−</button>
          <output id="qtyValue">1</output>
          <button type="button" class="step" id="qtyPlus" aria-label="1つ増やす">＋</button>
        </div>

        <label class="field-label" for="expiryInput">賞味期限・消費期限</label>
        <div class="chips wrap" id="quickDays"></div>
        <div class="date-row">
          <input type="date" id="expiryInput">
          <span class="badge" id="expiryBadge"></span>
        </div>

        <label class="field-label" for="memoInput">メモ(任意)</label>
        <input type="text" id="memoInput" placeholder="例:開封済み" autocomplete="off">

        <p class="form-error" id="formError" hidden></p>

        <button type="submit" class="btn btn-primary wide" id="submitBtn">冷蔵庫に追加</button>
        <button type="button" class="link-btn center danger" id="deleteBtn" hidden>この食材を削除</button>
      </div>
    </form>
  </div>

  <!-- ========== 確認ダイアログ ========== -->
  <div class="backdrop center-box" id="dialog" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
      <h2 id="dlgTitle"></h2>
      <p id="dlgMsg"></p>
      <div class="dlg-actions" id="dlgActions"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
